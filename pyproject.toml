[project]
name = "aitool-iroiro"
version = "0.1.0"
description = "CLI tools for multimodal AI tasks through OpenRouter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "typer>=0.25.1",
]

[project.scripts]
aitool = "aitool.cli:app"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.1",
    "pytest-httpx>=0.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitool"]
